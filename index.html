<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EvoSim - Nowa Mechanika</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #121212;
            font-family: monospace;
            color: white;
            user-select: none;
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
        }
        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        #touch-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
        }
        /* NippleJS overrides */
        .nipple {
            display: none !important; /* Hidden by default */
        }
        .nipple.active-joystick {
            display: block !important; /* Visible only when logic confirms */
        }
        .nipple .front {
            background: rgba(255, 255, 255, 0.5) !important;
            border: 2px solid rgba(255, 255, 255, 0.8) !important;
        }
        .nipple .back {
            background: rgba(255, 255, 255, 0.1) !important;
            border: 2px solid rgba(255, 255, 255, 0.3) !important;
        }
    </style>
</head>
<body>
    <div id="ui-layer" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 20; pointer-events: none;">
        <button id="btn-toggle-speed" style="pointer-events: auto; position: absolute; bottom: 20px; right: 20px; width: 60px; height: 60px; border-radius: 50%; background: rgba(255,255,255,0.2); border: 2px solid white; color: white; font-size: 24px;">🚶</button>
        <button id="btn-inventory" style="pointer-events: auto; position: absolute; top: 20px; right: 20px; width: 50px; height: 50px; background: rgba(0,0,0,0.5); border: 2px solid #aaa; color: white; font-size: 24px; border-radius: 8px;">🎒</button>
    </div>

    <!-- Inventory Panel -->
    <div id="inventory-panel" style="position: absolute; top: 0; right: -320px; width: 300px; height: 100%; background: rgba(20, 20, 20, 0.95); z-index: 30; transition: right 0.3s ease; padding: 10px; box-sizing: border-box; display: flex; flex-direction: column; border-left: 2px solid #444;">
        <h3 style="color: white; margin-top: 0;">Ekwipunek</h3>
        <div id="inv-weight" style="color: #ccc; margin-bottom: 10px; font-size: 14px;">0.0 / 0.0 kg</div>

        <div style="color: #aaa; font-size: 12px; margin-bottom: 5px;">Ręce (Przeciągnij tutaj)</div>
        <div id="inv-hands" style="display: flex; gap: 10px; margin-bottom: 20px; height: 70px;">
            <!-- Hand Slots Generated by JS -->
        </div>

        <div style="color: #aaa; font-size: 12px; margin-bottom: 5px;">Plecak</div>
        <div id="inv-slots" style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; overflow-y: auto;">
            <!-- Grid Slots Generated by JS -->
        </div>
    </div>

    <!-- Context Menu -->
    <div id="context-menu" style="display: none; position: absolute; z-index: 40; background: #333; border: 1px solid #555; padding: 5px; border-radius: 4px; box-shadow: 0 4px 6px rgba(0,0,0,0.5);">
        <!-- Actions -->
    </div>

    <style>
        .inv-slot {
            width: 100%;
            aspect-ratio: 1;
            background: rgba(255,255,255,0.1);
            border: 1px solid #555;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
            user-select: none;
        }
        .inv-slot.filled {
            background: rgba(255,255,255,0.2);
            border-color: #777;
        }
        .inv-slot.drag-over {
            border-color: #00b894;
            background: rgba(0, 184, 148, 0.2);
        }
        .hand-slot {
            width: 60px;
            height: 60px;
            border: 2px dashed #666;
        }
        .hand-slot::after {
            content: attr(data-hand);
            position: absolute;
            font-size: 10px;
            color: #555;
            margin-top: 45px;
        }
        #inventory-panel.open {
            right: 0 !important;
        }
        .ctx-action {
            display: block;
            width: 100%;
            padding: 8px 12px;
            background: transparent;
            border: none;
            color: white;
            text-align: left;
            cursor: pointer;
            font-size: 14px;
        }
        .ctx-action:hover {
            background: rgba(255,255,255,0.1);
        }
    </style>
    <div id="touch-overlay"></div>
    <canvas id="gameCanvas"></canvas>
    
    <script type="module" src="main.js"></script>
</body>
</html>
